version: "3.9"

services:
  backend:
    build:
      context: ./gridsphere-backend
      dockerfile: Dockerfile
    container_name: gridsphere-backend
    restart: unless-stopped
    env_file:
      - ./gridsphere-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=8000
    ports:
      - "9002:8000"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./gridsphere-frontend
      dockerfile: Dockerfile
    container_name: gridsphere-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9000:80"