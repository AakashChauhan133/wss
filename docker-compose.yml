version: "3.9"

services:

  backend:
    build:
      context: ./backend

    container_name: gridsphere-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend

    container_name: gridsphere-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "9000:80"